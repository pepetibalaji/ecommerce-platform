spring:
    application:
        name: cart-service

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Config Server may override these defaults per environment. TTL is refreshed
# whenever the corresponding cart is saved; reads do not extend it.
cart:
    customer:
        ttl: ${CART_CUSTOMER_TTL:7d}
    guest:
        ttl: ${CART_GUEST_TTL:30d}
        cookie:
            name: ${CART_GUEST_COOKIE_NAME:guestId}
            same-site: ${CART_GUEST_COOKIE_SAME_SITE:Lax}
            secure: ${CART_GUEST_COOKIE_SECURE:false}

logging:
    structured:
        format:
            console: logstash
            file: logstash
    file:
        name: ${OBSERVABILITY_LOG_FILE:../logs/cart-service.json}
    logback:
        rollingpolicy:
            max-file-size: ${OBSERVABILITY_LOG_MAX_FILE_SIZE:5MB}
            max-history: ${OBSERVABILITY_LOG_MAX_HISTORY:1}
            total-size-cap: ${OBSERVABILITY_LOG_TOTAL_SIZE_CAP:5MB}
            clean-history-on-start: true
