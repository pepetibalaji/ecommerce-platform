spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888},optional:file:${NOTIFICATION_LOCAL_ENV_FILE:../../ecommerce-config-repo/dev/.env}[.properties]

notification:
  out-of-stock-email-enabled: ${NOTIFICATION_OUT_OF_STOCK_EMAIL_ENABLED:false}
  smtp:
    host: ${NOTIFICATION_SMTP_HOST:localhost}
    port: ${NOTIFICATION_SMTP_PORT:1025}
    username: ${NOTIFICATION_SMTP_USERNAME:}
    password: ${NOTIFICATION_SMTP_PASSWORD:}
    auth: ${NOTIFICATION_SMTP_AUTH:false}
    starttls: ${NOTIFICATION_SMTP_STARTTLS:false}
    from-email: ${NOTIFICATION_SMTP_FROM_EMAIL:hello@pepekart.local}
    from-name: ${NOTIFICATION_SMTP_FROM_NAME:Pepekart}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}
    from-name: ${RESEND_FROM_NAME:Pepekart}
    template-ids:
      EMAIL_VERIFICATION: ${RESEND_TEMPLATE_EMAIL_VERIFICATION_ID:}
      PASSWORD_RESET: ${RESEND_TEMPLATE_PASSWORD_RESET_ID:}
      EMAIL_CHANGE_CONFIRMATION: ${RESEND_TEMPLATE_EMAIL_CHANGE_CONFIRMATION_ID:}
      ORDER_RECEIVED: ${RESEND_TEMPLATE_ORDER_RECEIVED_ID:}
      PAYMENT_SUCCESSFUL: ${RESEND_TEMPLATE_PAYMENT_SUCCESSFUL_ID:}
      PAYMENT_FAILED: ${RESEND_TEMPLATE_PAYMENT_FAILED_ID:}
      ORDER_CANCELLED: ${RESEND_TEMPLATE_ORDER_CANCELLED_ID:}
      REFUND_PROCESSED: ${RESEND_TEMPLATE_REFUND_PROCESSED_ID:}
      ORDER_SHIPPED: ${RESEND_TEMPLATE_ORDER_SHIPPED_ID:}
      ORDER_DELIVERED: ${RESEND_TEMPLATE_ORDER_DELIVERED_ID:}
      LOW_STOCK_WARNING: ${RESEND_TEMPLATE_LOW_STOCK_WARNING_ID:}
      OUT_OF_STOCK_WARNING: ${RESEND_TEMPLATE_OUT_OF_STOCK_WARNING_ID:}
      SELLER_NEW_ORDER: ${RESEND_TEMPLATE_SELLER_NEW_ORDER_ID:}
  mailtrap:
    sandbox-inbox-id: ${MAILTRAP_SANDBOX_INBOX_ID:4883696}
    template-uuids:
      EMAIL_VERIFICATION: ${MAILTRAP_TEMPLATE_EMAIL_VERIFICATION_UUID:${MAILTRAP_VERIFICATION_TEMPLATE_UUID:31a79ec0-e191-49d6-a730-4a50b30da69d}}
      PASSWORD_RESET: ${MAILTRAP_TEMPLATE_PASSWORD_RESET_UUID:}
      EMAIL_CHANGE_CONFIRMATION: ${MAILTRAP_TEMPLATE_EMAIL_CHANGE_CONFIRMATION_UUID:}
      ORDER_RECEIVED: ${MAILTRAP_TEMPLATE_ORDER_RECEIVED_UUID:}
      PAYMENT_SUCCESSFUL: ${MAILTRAP_TEMPLATE_PAYMENT_SUCCESSFUL_UUID:}
      PAYMENT_FAILED: ${MAILTRAP_TEMPLATE_PAYMENT_FAILED_UUID:}
      ORDER_CANCELLED: ${MAILTRAP_TEMPLATE_ORDER_CANCELLED_UUID:}
      REFUND_PROCESSED: ${MAILTRAP_TEMPLATE_REFUND_PROCESSED_UUID:}
      ORDER_SHIPPED: ${MAILTRAP_TEMPLATE_ORDER_SHIPPED_UUID:}
      ORDER_DELIVERED: ${MAILTRAP_TEMPLATE_ORDER_DELIVERED_UUID:}
      LOW_STOCK_WARNING: ${MAILTRAP_TEMPLATE_LOW_STOCK_WARNING_UUID:}
      OUT_OF_STOCK_WARNING: ${MAILTRAP_TEMPLATE_OUT_OF_STOCK_WARNING_UUID:}
      SELLER_NEW_ORDER: ${MAILTRAP_TEMPLATE_SELLER_NEW_ORDER_UUID:}
  auth-action-delivery:
    auth-base-url: ${AUTH_SERVICE_INTERNAL_URL:http://localhost:8081}
    internal-service-token: ${AUTH_INTERNAL_SERVICE_TOKEN:}
    verification-url: ${AUTH_EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
    password-reset-url: ${AUTH_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
    email-change-url: ${AUTH_EMAIL_CHANGE_URL:http://localhost:5173/confirm-email-change}

logging:
  structured:
    format:
      console: logstash
  file:
    name: ${OBSERVABILITY_LOG_FILE:../logs/notification-service.json}
