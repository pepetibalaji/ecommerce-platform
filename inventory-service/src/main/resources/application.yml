spring:
    application:
        name: inventory-service

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

    kafka:
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            properties:
                spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
                spring.json.trusted.packages: com.ecommerce.common.events.product,com.ecommerce.common.events.order,com.ecommerce.common.events.inventory
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

inventory:
    reservation:
        ttl: ${INVENTORY_RESERVATION_TTL:PT15M}
        expiry-scan-delay: ${INVENTORY_RESERVATION_EXPIRY_SCAN_DELAY:30000}
    grpc:
        # Production overlays must enable mTLS and inject certificates through the platform secret store.
        require-mtls: ${INVENTORY_GRPC_REQUIRE_MTLS:false}
        allowed-callers: ${INVENTORY_GRPC_ALLOWED_CALLERS:order-service}
    low-stock:
        default-threshold: ${INVENTORY_LOW_STOCK_THRESHOLD:5}
        notification-cooldown: ${INVENTORY_LOW_STOCK_NOTIFICATION_COOLDOWN:PT24H}
    reconciliation:
        delay: ${INVENTORY_RECONCILIATION_DELAY:300000}
    outbox:
        poll-delay: ${INVENTORY_OUTBOX_POLL_DELAY:1000}

grpc:
    clients:
        product-snapshot:
            host: ${PRODUCT_GRPC_HOST:localhost}
            port: ${PRODUCT_GRPC_PORT:9092}
            deadline-ms: ${PRODUCT_GRPC_DEADLINE_MS:5000}
            plaintext: ${PRODUCT_GRPC_PLAINTEXT:true}

logging:
    structured:
        format:
            console: logstash
            file: logstash
    file:
        name: ${OBSERVABILITY_LOG_FILE:../logs/inventory-service.json}
    logback:
        rollingpolicy:
            max-file-size: ${OBSERVABILITY_LOG_MAX_FILE_SIZE:5MB}
            max-history: ${OBSERVABILITY_LOG_MAX_HISTORY:1}
            total-size-cap: ${OBSERVABILITY_LOG_TOTAL_SIZE_CAP:5MB}
            clean-history-on-start: true
