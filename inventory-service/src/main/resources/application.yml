spring:
    application:
        name: inventory-service

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

logging:
    structured:
        format:
            console: logstash
            file: logstash
    file:
        name: ${OBSERVABILITY_LOG_FILE:../logs/inventory-service.json}
