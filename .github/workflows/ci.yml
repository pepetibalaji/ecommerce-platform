name: CI Pipeline

on:
    push:
        branches:
            - develop
            - "feature/**"
        paths:
            - "pom.xml"
            - "common/**"
            - "auth-service/**"
            - "product-service/**"
            - "inventory-service/**"
            - "cart-service/**"
            - ".github/workflows/ci.yml"

    pull_request:
        branches:
            - develop
            - main
        paths:
            - "pom.xml"
            - "common/**"
            - "auth-service/**"
            - "product-service/**"
            - "inventory-service/**"
            - "cart-service/**"
            - ".github/workflows/ci.yml"

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: ecommerce
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d ecommerce"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Build and Verify
              run: mvn -pl auth-service,product-service,inventory-service,cart-service -am clean verify
              env:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce
                  SPRING_DATASOURCE_USERNAME: postgres
                  SPRING_DATASOURCE_PASSWORD: postgres
                  SPRING_DATA_REDIS_HOST: localhost
                  SPRING_DATA_REDIS_PORT: 6379

    docker-build:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Package Project
              run: mvn -pl auth-service,product-service,inventory-service,cart-service -am clean package -DskipTests

            - name: Build Auth Image
              run: docker build -t auth-service ./auth-service

            - name: Build Product Image
              run: docker build -t product-service ./product-service

            - name: Build Inventory Image
              run: docker build -t inventory-service ./inventory-service

            - name: Build Cart Image
              run: docker build -t cart-service ./cart-service
