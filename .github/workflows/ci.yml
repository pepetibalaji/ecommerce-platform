name: CI Pipeline

on:
    push:
        branches:
            - develop
            - "feature/**"

    pull_request:
        branches:
            - develop
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Build and Verify
              run: mvn clean verify
