name: CI Pipeline

on:
    push:
        branches:
            - develop
            - "feature/**"
        paths:
            - "pom.xml"
            - "common/**"
            - "auth-service/**"
            - "product-service/**"
            - "inventory-service/**"
            - "cart-service/**"
            - "order-service/**"
            - ".github/workflows/ci.yml"

    pull_request:
        branches:
            - develop
            - main
        paths:
            - "pom.xml"
            - "common/**"
            - "auth-service/**"
            - "product-service/**"
            - "inventory-service/**"
            - "cart-service/**"
            - "order-service/**"
            - ".github/workflows/ci.yml"

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: ecommerce
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d ecommerce"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            kafka:
                image: Confluent Kafka 7.6.1
                ports:
                    - 9092:9092
                env:
                    KAFKA_CFG_NODE_ID: 1
                    KAFKA_CFG_PROCESS_ROLES: broker,controller
                    KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
                    KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
                    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
                    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
                    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
                    KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
                    ALLOW_PLAINTEXT_LISTENER: "yes"
                options: >-
                    --health-cmd="bash -c 'echo > /dev/tcp/127.0.0.1/9092'"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Build and Verify
              run: mvn -pl auth-service,product-service,inventory-service,cart-service,order-service -am clean verify
              env:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce
                  SPRING_DATASOURCE_USERNAME: postgres
                  SPRING_DATASOURCE_PASSWORD: postgres
                  SPRING_DATA_REDIS_HOST: localhost
                  SPRING_DATA_REDIS_PORT: 6379
                  SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
                  CONFIG_SERVER_URL: http://localhost:8888

    docker-build:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Package Project
              run: mvn -pl auth-service,product-service,inventory-service,cart-service,order-service -am clean package -DskipTests

            - name: Build Auth Image
              run: docker build -t auth-service ./auth-service

            - name: Build Product Image
              run: docker build -t product-service ./product-service

            - name: Build Inventory Image
              run: docker build -t inventory-service ./inventory-service

            - name: Build Cart Image
              run: docker build -t cart-service ./cart-service

            - name: Build Order Image
              run: docker build -t order-service ./order-service
