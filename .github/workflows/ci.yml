name: CI Pipeline

on:
    push:
        branches:
            - develop
            - "feature/**"

    pull_request:
        branches:
            - develop
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Build and Verify
              run: mvn clean verify

    docker-build:
        runs-on: ubuntu-latest

        needs: build

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Package Project
              run: mvn clean package -DskipTests

            - name: Build Config Server Image
              run: docker build -t config-server ./config-server

            - name: Build Gateway Image
              run: docker build -t gateway-service ./gateway-service

            - name: Build Auth Image
              run: docker build -t auth-service ./auth-service

            - name: Build Product Image
              run: docker build -t product-service ./product-service
