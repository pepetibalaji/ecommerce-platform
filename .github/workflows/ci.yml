name: CI Pipeline

on:
    push:
        branches:
            - develop

            - "feature/**"

    pull_request:
        branches:
            - develop

            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository

              uses: actions/checkout@v4

            - name: Set up JDK 21

              uses: actions/setup-java@v4

              with:
                  java-version: "21"

                  distribution: "temurin"

                  cache: maven

            - name: Build Project

              run: mvn clean verify

            - name: Run Tests

              run: mvn test
