receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318

processors:
    memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
    batch:
        timeout: 5s
        send_batch_size: 1024

exporters:
    # FIX: Updated to your exact container_name from docker-compose
    otlp/tempo:
        endpoint: ecommerce-tempo:4317
        tls:
            insecure: true
    prometheus:
        endpoint: 0.0.0.0:8889
    debug:
        verbosity: basic

extensions:
    health_check:
        endpoint: 0.0.0.0:13133

service:
    extensions:
        - health_check
    pipelines:
        traces:
            receivers:
                - otlp
            processors:
                - memory_limiter
                - batch
            exporters:
                - otlp/tempo
                - debug
        metrics:
            receivers:
                - otlp
            processors:
                - memory_limiter
                - batch
            exporters:
                - prometheus
                - debug
