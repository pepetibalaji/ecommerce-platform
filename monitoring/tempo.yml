server:
    http_listen_port: 3200

distributor:
    receivers:
        otlp:
            protocols:
                grpc:
                    endpoint: 0.0.0.0:4317
                http:
                    endpoint: 0.0.0.0:4318

ingester:
    max_block_duration: 5m
    lifecycler:
        ring:
            kvstore:
                store: inmemory
            replication_factor: 1

compactor:
    compaction:
        block_retention: 168h

metrics_generator:
    registry:
        external_labels:
            source: tempo
            environment: local
            cluster: ecommerce-local
    storage:
        path: /var/tempo/generator/wal
        remote_write:
            - url: http://prometheus:9090/api/v1/write
              send_exemplars: true

storage:
    trace:
        backend: local
        wal:
            path: /var/tempo/wal
        local:
            path: /var/tempo/blocks

overrides:
    defaults:
        metrics_generator:
            processors:
                - service-graphs
                - span-metrics
