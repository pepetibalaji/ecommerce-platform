apiVersion: 1

datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      jsonData:
          httpMethod: POST
          # LINK: Allows you to jump from an exemplar in a metric chart directly to its Tempo Trace
          exemplarTraceIdDestinations:
              - datasourceUid: tempo
                name: traceID

    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      jsonData:
          httpMethod: GET
          serviceMap:
              datasourceUid: prometheus
          nodeGraph:
              enabled: true
          tracesToMetrics:
              datasourceUid: prometheus
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags: [{ key: "service.name", value: "service" }]
              queries:
                  - name: "Trace request rate"
                    query: 'sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))'
                  - name: "Trace error rate"
                    query: 'sum(rate(traces_spanmetrics_calls_total{$__tags,status_code="STATUS_CODE_ERROR"}[5m]))'

    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
          derivedFields:
              - name: Trace ID
                matcherRegex: '"traceId":"([a-fA-F0-9]+)"'
                datasourceUid: tempo
                url: '$${__value.raw}'
                urlDisplayLabel: View trace
