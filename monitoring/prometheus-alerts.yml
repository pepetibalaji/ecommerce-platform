groups:
  - name: ecommerce-service-health
    rules:
      - alert: EcommerceServiceDown
        expr: up{job=~"config-server|gateway-service|auth-service|product-service|inventory-service|cart-service|order-service|payment-service|notification-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for two minutes."

      - alert: HighHttpServerErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job=~"gateway-service|auth-service|product-service|inventory-service|cart-service|order-service|payment-service|notification-service",status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job=~"gateway-service|auth-service|product-service|inventory-service|cart-service|order-service|payment-service|notification-service"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has a high 5xx rate"
          description: "More than 5% of HTTP requests have returned 5xx responses for five minutes."

      - alert: HighHttpP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{job=~"gateway-service|auth-service|product-service|inventory-service|cart-service|order-service|payment-service|notification-service"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 latency is high"
          description: "The HTTP p95 latency has been above one second for ten minutes."

  - name: ecommerce-order-payment-outcomes
    rules:
      - alert: OrderPaymentOutcomeDlq
        expr: sum(increase(order_payment_outcome_dlq_count_total{service="order-service"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "A payment outcome was sent to the order DLQ"
          description: "Order Service exhausted retries while processing a payment outcome in the last five minutes."

      - alert: OrderPaymentOutcomeRetrySpike
        expr: sum(increase(order_payment_outcome_retry_count_total{service="order-service"}[10m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order Service payment outcome retries are elevated"
          description: "More than five payment outcome retries occurred in the last ten minutes."

      - alert: OrderPaymentOutcomeConsumerLag
        expr: sum(kafka_consumergroup_lag{consumergroup="order-service-payment-outcomes",topic=~"payment-success|payment-failed|payment-expired|payment-refund-completed|payment-refund-failed"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Order Service payment outcome consumer lag is high"
          description: "The payment outcome consumer group has more than 100 unprocessed records for ten minutes."

      - alert: OrderInventoryReleaseRetrySpike
        expr: sum(increase(order_inventory_release_failed_count_total{service="order-service"}[10m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order Service inventory-release retries are elevated"
          description: "More than five inventory-release command attempts failed in the last ten minutes; inspect the release outbox and Inventory Service."

  - name: ecommerce-product-inventory-provisioning
    rules:
      - alert: ProductCreatedEventPublishFailure
        expr: sum(increase(product_created_event_publish_failures_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Product-created event publish failed"
          description: "A product may be missing its zero-stock inventory record; reconcile by replaying product-created."

      - alert: ProductInventoryProvisionerLag
        expr: sum(kafka_consumergroup_lag{consumergroup="inventory-product-provisioner",topic="product-created"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Product inventory provisioner lag is high"
          description: "More than 100 product-created records are waiting for Inventory Service."

      - alert: ProductInventoryProvisioningDlq
        expr: sum(kafka_topic_partition_current_offset{topic="product-created-dlt"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Product inventory provisioning has DLQ records"
          description: "Inspect product-created-dlt and reconcile affected product inventory records."

      - alert: OrderInventoryReleaseTerminalFailure
        expr: sum(increase(order_inventory_release_terminal_failure_count_total{service="order-service"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "An inventory-release command exhausted retries"
          description: "Order Service marked an inventory-release outbox command FAILED in the last five minutes; investigate the command and Inventory Service before manual recovery."

  - name: ecommerce-notifications
    rules:
      - alert: NotificationDeliveryExhausted
        expr: sum(increase(notification_delivery_exhausted_total{service="notification-service"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "A notification delivery exhausted all retries"
          description: "Notification Service has permanently failed at least one delivery in the last five minutes. Inspect failed notifications and provider health."

      - alert: NotificationConsumerLag
        expr: sum(kafka_consumergroup_lag{consumergroup="notification-service",topic=~"order-created|payment-success|payment-failed|order-cancelled|payment-refund-completed|order-shipped|order-delivered|low-inventory|seller-order-paid|user-contact-updated"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Notification Service consumer lag is high"
          description: "Notification Service has more than 100 unprocessed notification events for ten minutes."

  - name: ecommerce-inventory-reliability
    rules:
      - alert: InventoryOutboxDeadLetter
        expr: sum(increase(inventory_outbox_dead_total[5m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Inventory event outbox exhausted delivery retries"
          description: "Inspect inventory_event_outbox DEAD records and Kafka availability."
      - alert: InventoryGrpcAuthorizationFailures
        expr: sum(increase(inventory_grpc_authorization_failures_total[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Inventory rejected an internal gRPC caller"
          description: "Check mTLS identity, x-internal-caller, and network policy."
      - alert: InventoryReservationExpirySpike
        expr: sum(increase(inventory_reservations_expired_released_total[15m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Inventory reservation expiry rate is elevated"
          description: "Investigate checkout/payment completion latency."
      - alert: InventoryLifecycleConsumerLag
        expr: sum(kafka_consumergroup_lag{consumergroup="inventory-product-lifecycle",topic="product.lifecycle.v1"}) > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Inventory product lifecycle consumer lag is high"
          description: "Inventory lifecycle synchronization is delayed."

  - name: ecommerce-payment-reliability
    rules:
      - alert: PaymentOutboxTerminalFailure
        expr: payment_outbox_dead_count > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Payment outcomes need manual delivery recovery"
          description: "Inspect payment_event_outbox DEAD rows. Restore Kafka and replay existing event IDs through the authenticated operations endpoint."
      - alert: PaymentWebhookInvalidSignature
        expr: sum(increase(payment_webhook_invalid_signature_count_total[5m])) > 10
        labels:
          severity: warning
        annotations:
          summary: "Payment webhook signatures are being rejected"
          description: "Check provider endpoint secrets and overlap rotation; investigate unexpected traffic."
      - alert: PaymentWebhookUnresolved
        expr: sum(increase(payment_webhook_unresolved_total[15m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "Verified payment webhooks cannot be matched"
          description: "Inspect safe webhook metadata, checkout reservation keys and provider identifiers."
      - alert: PaymentWebhookStateConflict
        expr: sum(increase(payment_webhook_state_conflict_total[5m])) > 0 or sum(increase(payment_webhook_transition_failed_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Payment state transition requires review"
          description: "Inspect late success, amount mismatch or failed database transitions without changing terminal state from a browser return."
      - alert: PaymentWebhookDuplicateAnomaly
        expr: sum(increase(payment_webhook_duplicate_anomaly_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A provider event ID arrived with different payload hashes"
      - alert: PaymentRefundManualReview
        expr: sum(increase(payment_refund_manual_review_count_total[5m])) > 0 or sum(increase(payment_cancellation_manual_review_count_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Payment cancellation or refund requires operations review"
          description: "Reserve uncertain refund amounts. Reconcile the original provider ID/key; never create a replacement refund after uncertain acceptance."
      - alert: PaymentCommandDeadLetter
        expr: sum(increase(payment_command_dlq_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "An Order command exhausted Payment retries"
          description: "Inspect the topic-specific .DLT and trusted Order lookup availability; replay the unchanged command after correction."