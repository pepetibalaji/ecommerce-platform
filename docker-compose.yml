name: ecommerce-platform

networks:
    ecommerce-network:
        driver: bridge

volumes:
    postgres-data:
    redis-data:
    kafka-data:
    tempo-data:
    prometheus-data:
    grafana-data:

x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    postgres:
        image: postgres:16.14-alpine
        container_name: ecommerce-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
            POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_password}
        ports:
            - "${POSTGRES_PORT:-5433}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - ecommerce-network
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        logging: *default-logging

    redis:
        image: redis:8.8-alpine
        container_name: ecommerce-redis
        restart: unless-stopped
        command:
            [
                "redis-server",
                "--appendonly",
                "yes",
                "--save",
                "60",
                "1",
                "--loglevel",
                "warning",
            ]
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis-data:/data
        networks:
            - ecommerce-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        logging: *default-logging

    kafka:
        image: apache/kafka:4.3.0
        container_name: ecommerce-kafka
        hostname: kafka
        restart: unless-stopped
        ports:
            # Use localhost:29092 from services running on your machine.
            # Use kafka:9092 from services running inside Docker Compose.
            - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
        environment:
            CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_DEFAULT_REPLICATION_FACTOR: 1
            KAFKA_MIN_INSYNC_REPLICAS: 1
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
            KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
        volumes:
            - kafka-data:/var/lib/kafka/data
        networks:
            - ecommerce-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1",
                ]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 40s
        logging: *default-logging

    kafka-init:
        image: apache/kafka:4.3.0
        container_name: ecommerce-kafka-init
        restart: "no"
        volumes:
            - ./monitoring/create-kafka-topics.sh:/create-kafka-topics.sh:ro
        entrypoint: ["/bin/bash", "/create-kafka-topics.sh"]
        networks:
            - ecommerce-network
        logging: *default-logging

    tempo:
        image: grafana/tempo:${TEMPO_VERSION:-2.10.7}
        container_name: ecommerce-tempo
        restart: unless-stopped
        command: ["-config.file=/etc/tempo/tempo.yml"]
        ports:
            # Grafana and local debugging use the Tempo HTTP API.
            # The OTLP ports are intentionally internal; applications should send OTLP to otel-collector.
            - "${TEMPO_HTTP_PORT:-3200}:3200"
        volumes:
            - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
            - tempo-data:/var/tempo
        networks:
            - ecommerce-network
        logging: *default-logging

    otel-collector:
        image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.154.0}
        container_name: ecommerce-otel-collector
        restart: unless-stopped
        command: ["--config=/etc/otelcol-contrib/config.yml"]
        ports:
            # Applications running on your machine send OTLP here.
            - "${OTEL_GRPC_PORT:-4317}:4317"
            - "${OTEL_HTTP_PORT:-4318}:4318"
            # Health endpoint and Prometheus exporter for local validation.
            - "${OTEL_HEALTH_PORT:-13133}:13133"
            - "${OTEL_PROM_EXPORTER_PORT:-8889}:8889"
        volumes:
            - ./monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
        networks:
            - ecommerce-network
        depends_on:
            - tempo
        logging: *default-logging

    prometheus:
        image: prom/prometheus:v3.5.4
        container_name: ecommerce-prometheus
        restart: unless-stopped
        ports:
            - "${PROMETHEUS_PORT:-9090}:9090"
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
        networks:
            - ecommerce-network
        depends_on:
            kafka:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            otel-collector:
                condition: service_started
        logging: *default-logging

    grafana:
        image: grafana/grafana:13.0.2
        container_name: ecommerce-grafana
        restart: unless-stopped
        ports:
            - "${GRAFANA_PORT:-3000}:3000"
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
            GF_USERS_ALLOW_SIGN_UP: "false"
        volumes:
            - grafana-data:/var/lib/grafana
            - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
        networks:
            - ecommerce-network
        depends_on:
            - prometheus
            - tempo
        logging: *default-logging
