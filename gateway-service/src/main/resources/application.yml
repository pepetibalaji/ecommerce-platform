spring:
    application:
        name: gateway-service

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

    cloud:
        gateway:
            server:
                webflux:
                    httpclient:
                        # Bound downstream calls so one unhealthy service cannot exhaust Netty connections.
                        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
                        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}

    webflux:
        problemdetails:
            enabled: true

gateway:
    rate-limit:
        # Direct clients must not be allowed to choose their own X-Forwarded-For identity.
        trust-forwarded-for: ${GATEWAY_TRUST_FORWARDED_FOR:false}

    cors:
        allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

logging:
    structured:
        format:
            console: logstash
            file: logstash
    file:
        name: ${OBSERVABILITY_LOG_FILE:../logs/gateway-service.json}
    logback:
        rollingpolicy:
            max-file-size: ${OBSERVABILITY_LOG_MAX_FILE_SIZE:5MB}
            max-history: ${OBSERVABILITY_LOG_MAX_HISTORY:1}
            total-size-cap: ${OBSERVABILITY_LOG_TOTAL_SIZE_CAP:5MB}
            clean-history-on-start: true

management:
    endpoint:
        health:
            probes:
                enabled: true
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,gateway
