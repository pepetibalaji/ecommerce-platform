spring:
    application:
        name: product-service

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

    kafka:
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all
            properties:
                enable.idempotence: true
                spring.json.add.type.headers: true

product:
    outbox:
        batch-size: ${PRODUCT_OUTBOX_BATCH_SIZE:100}
        max-attempts: ${PRODUCT_OUTBOX_MAX_ATTEMPTS:10}
        retry-delay-seconds: ${PRODUCT_OUTBOX_RETRY_DELAY_SECONDS:5}
    catalogue:
        query-timeout-ms: ${PRODUCT_QUERY_TIMEOUT_MS:2000}

logging:
    structured:
        format:
            console: logstash
            file: logstash
    file:
        name: ${OBSERVABILITY_LOG_FILE:../logs/product-service.json}
    logback:
        rollingpolicy:
            max-file-size: ${OBSERVABILITY_LOG_MAX_FILE_SIZE:5MB}
            max-history: ${OBSERVABILITY_LOG_MAX_HISTORY:1}
            total-size-cap: ${OBSERVABILITY_LOG_TOTAL_SIZE_CAP:5MB}
            clean-history-on-start: true
