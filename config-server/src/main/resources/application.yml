server:
    port: 8888

spring:
    application:
        name: config-server

    cloud:
        config:
            server:
                git:
                    uri: https://github.com/pepetibalaji/ecommerce-config-repo
                    default-label: main
                    clone-on-start: true
                    # The config repository stores profile-specific service files
                    # under dev/, stage/, and prod/.
                    search-paths: '{profile}'

management:
    endpoints:
        web:
            exposure:
                include: health,info,refresh,prometheus
    endpoint:
        health:
            show-details: always

logging:
    structured:
        format:
            console: logstash
            file: logstash
    file:
        name: ${OBSERVABILITY_LOG_FILE:../logs/config-server.json}
    logback:
        rollingpolicy:
            # Alloy forwards the active file to Grafana Cloud. Keep only a small
            # on-host buffer so a delivery outage cannot exhaust disk space.
            max-file-size: ${OBSERVABILITY_LOG_MAX_FILE_SIZE:5MB}
            max-history: ${OBSERVABILITY_LOG_MAX_HISTORY:1}
            total-size-cap: ${OBSERVABILITY_LOG_TOTAL_SIZE_CAP:5MB}
            clean-history-on-start: true
