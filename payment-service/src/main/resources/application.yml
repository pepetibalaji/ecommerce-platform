spring:
    application:
        name: payment-service

    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

logging:
    structured:
        format:
            console: logstash
            file: logstash
    file:
        name: ${OBSERVABILITY_LOG_FILE:../logs/payment-service.json}
