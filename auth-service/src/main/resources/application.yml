server:
    port: 8081

spring:
    application:
        name: auth-service

    profiles:
        active: dev

    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

    jackson:
        time-zone: UTC

    jpa:
        properties:
            hibernate.jdbc.time_zone: UTC

management:
    endpoints:
        web:
            exposure:
                include: "*"

    endpoint:
        health:
            show-details: always